<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<header class="top">
  <div class="brand"><span class="logo">✂</span><b>Paper Transition Studio</b><span class="badge">PRO</span></div>
  <input id="projName" class="pname" aria-label="Project name" />
  <div class="top-actions">
    <button class="btn ghost" id="btnTemplates" title="Start from a ready-made project">Templates</button>
    <button class="btn ghost" id="btnOpen" title="Open a saved project (.json)">Open</button>
    <button class="btn ghost" id="btnSave" title="Download the project file (Ctrl+S)">Save</button>
    <button class="btn" id="btnExport">Export</button>
  </div>
</header>

<main class="work" id="work">
  <aside class="panel lib" id="panelLib" data-panel="lib">
    <div class="panel-head">
      <h2>Effects</h2>
      <input id="libSearch" class="search" placeholder="Search tear, burn, crumple…" />
    </div>
    <div class="chips" id="libChips"></div>
    <div class="lib-grid" id="libGrid"></div>
    <p class="hint">Click an effect to put it on the selected transition. <b>+</b> adds a new shot that uses it.</p>
  </aside>

  <section class="center">
    <div class="stage-wrap" id="stageWrap">
      <canvas id="stage" width="1920" height="1080"></canvas>
      <div class="drop-note" id="dropNote">Drop photos or videos to add shots</div>
    </div>
    <div class="transport">
      <button class="icon" id="btnPlay" title="Play / pause (Space)">▶</button>
      <span class="time" id="timeLabel">0:00.0 / 0:00.0</span>
      <input type="range" id="scrub" min="0" max="1000" value="0" step="1" aria-label="Timeline position" />
      <label class="tog" title="Loop"><input type="checkbox" id="chkLoop" checked /> Loop</label>
      <label class="tog" title="Paper sound effects"><input type="checkbox" id="chkSfx" /> Sound</label>
      <select id="selQuality" title="Preview quality">
        <option value="1">Full</option><option value="0.5">Half</option><option value="0.33">Fast</option>
      </select>
    </div>
  </section>

  <section class="panel timeline-panel" data-panel="timeline" id="panelTimeline">
    <div class="panel-head row">
      <h2>Timeline</h2>
      <div class="row gap">
        <button class="btn sm ghost" id="btnAddPaper">+ Paper</button>
        <button class="btn sm ghost" id="btnAddMedia">+ Photo / video</button>
        <button class="btn sm ghost" id="btnAddKey">+ Green screen</button>
        <button class="btn sm ghost" id="btnProject">Project settings</button>
      </div>
    </div>
    <div class="timeline" id="timeline"></div>
  </section>

  <aside class="panel insp" id="panelInsp" data-panel="insp">
    <div id="insp"></div>
  </aside>
</main>

<nav class="mtabs" id="mtabs">
  <button data-tab="lib" class="on">Effects</button>
  <button data-tab="timeline">Timeline</button>
  <button data-tab="insp">Edit</button>
  <button data-tab="export">Export</button>
</nav>

<dialog id="dlgExport" class="dlg">
  <form method="dialog" class="dlg-body" id="exportForm">
    <h2>Export</h2>
    <label>What to export<select id="exMode"></select></label>
    <label>Range<select id="exRange"></select></label>
    <div class="row gap wrap">
      <label class="grow">Size<select id="exSize"></select></label>
      <label>Frame rate<select id="exFps"><option>24</option><option>25</option><option selected>30</option><option>50</option><option>60</option></select></label>
    </div>
    <label class="tog"><input type="checkbox" id="exAudio" /> Include paper sound effects</label>
    <p class="hint" id="exHint"></p>
    <div class="progress"><div id="exBar"></div></div>
    <p class="hint" id="exStatus"></p>
    <div class="row gap end">
      <button class="btn ghost" type="button" id="exWav">Sound only (.wav)</button>
      <button class="btn ghost" value="cancel" id="exClose">Close</button>
      <button class="btn" type="button" id="exGo">Export video</button>
    </div>
  </form>
</dialog>

<dialog id="dlgTemplates" class="dlg">
  <form method="dialog" class="dlg-body">
    <h2>Start from a template</h2>
    <p class="hint">This replaces the current project (save first if you need it).</p>
    <div class="tpl-grid" id="tplGrid"></div>
    <div class="row end"><button class="btn ghost" value="cancel">Close</button></div>
  </form>
</dialog>

<input type="file" id="fileMedia" accept="image/*,video/*" multiple hidden />
<input type="file" id="fileProject" accept=".json,application/json" hidden />
<div class="toast" id="toast"></div>
