<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Timeline Animation Studio Pro</title><style>/* @inline:src/fonts.css */</style><style>/* @inline:src/styles.css */</style><style>/* @inline:src/craft.css */</style><style>
/* @inline:src/mas-cutroom.css */
</style>
</head>
<body>
<header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">↔</span><span>Timeline<span class="brand-light"> Studio</span></span></div><div class="project-meta"><input id="projectName" aria-label="Project name" maxlength="120"><span id="saveStatus">Saved on this device</span></div><div class="top-actions"><button id="undo" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button><button id="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷</button><button id="open">Open</button><button id="save">Save</button><button id="export" class="primary">Export ↗</button></div></header>
<main class="workspace" data-mobile="library">
<aside class="library panel" id="libraryPanel"><nav class="panel-tabs" aria-label="Library"><button class="active" data-library="presets">Documentary</button><button data-library="events">Events</button><button data-library="diagrams">Diagrams</button><button data-library="saved">Saved</button></nav><div class="library-content"><div id="library"></div></div><footer class="library-footer"><button id="help" class="help-button" aria-label="Open help">?</button><button id="references" title="Review the 26 YouTube references">26 refs</button><span>Offline · Your media stays on your device</span></footer></aside>
<section class="editor"><div class="stage-toolbar"><div class="segmented"><button id="animateMode" class="active">Animation</button><button id="arrangeMode">Arrange</button></div><span class="stage-note" id="stageNote">Preview your timeline</span><button id="backdrop" title="Import documentary footage or background image">Backdrop</button><button id="fit" title="Show the whole timeline" aria-label="Show the whole timeline">Fit</button><select id="viewerZoom" aria-label="Preview magnification"><option value="1">Fit</option><option value="1.5">150%</option><option value="2">200%</option></select><button id="expand" title="Expand preview" aria-label="Expand preview">Expand</button><select id="aspect" aria-label="Composition aspect ratio"><option value="landscape">16:9 Landscape</option><option value="portrait">9:16 Portrait</option><option value="square">1:1 Square</option></select></div><div class="stage-wrap" id="stageWrap"><canvas id="stage" aria-label="Animated timeline preview" tabindex="0"></canvas><div class="stage-caption"><span id="stageLabel">TIMELINE / PREVIEW</span><span id="resolution"></span></div></div><div class="transport"><button id="play" class="play" aria-label="Play (Space)">▶</button><button id="restart" title="Return to start" aria-label="Return to start">|‹</button><output id="timeLabel">00:00.0 / 00:18.0</output><input id="scrub" type="range" min="0" max="18" step="0.01" value="0" aria-label="Playback time"><label class="loop-label"><input id="loop" type="checkbox" checked> Loop</label><select id="quality" aria-label="Preview quality"><option value="auto">Preview: Auto</option><option value="fast">Preview: Fast</option><option value="full">Preview: Full</option></select></div><section class="timeline-panel"><div class="section-heading"><div><h2>Camera & events <span id="eventCount"></span></h2><p>Drag an event to retime it; drag a hold edge to change pacing.</p></div><button id="autoTiming">Rebuild timing</button><button id="addEvent">Add event</button></div><div id="timeline"></div></section></section>
<aside class="inspector panel" id="inspectorPanel"><nav class="panel-tabs" aria-label="Inspector"><button data-inspector="event" class="active">Edit</button><button data-inspector="style">Style</button><button data-inspector="motion">Motion</button><button data-inspector="project">Project</button></nav><div class="inspector-content" id="inspector"></div></aside>
</main>
<nav class="mobile-tabs" aria-label="Mobile panels"><button data-mobile="library" class="active">▦<span>Library</span></button><button data-mobile="events">☷<span>Events</span></button><button data-mobile="edit">✎<span>Edit</span></button><button data-mobile="export">↗<span>Export</span></button></nav>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button id="closeDialog" aria-label="Close dialog">×</button></div><div id="dialogBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div><input id="projectFile" type="file" accept=".json,.timeline.json" hidden><input id="csvFile" type="file" accept=".csv,text/csv" hidden><input id="backdropFile" type="file" accept="image/png,image/jpeg,image/webp,video/mp4,video/webm" hidden><input id="photoFile" type="file" accept="image/png,image/jpeg,image/webp" hidden>
<script>/* @inline:vendor/mediabunny.min.js */</script><script>/* @inline:src/core/util.js */</script><script>/* @inline:src/ui/templates.js */</script><script>/* @inline:src/ui/demo-assets.js */</script><script>/* @inline:src/ui/demo-cutouts.js */</script><script>/* @inline:src/ui/documentary-presets.js */</script><script>/* @inline:src/ui/craft-assets.js */</script><script>/* @inline:src/ui/craft-presets.js */</script><script>/* @inline:src/core/renderer.js */</script><script>/* @inline:src/core/documentary.js */</script><script>/* @inline:src/ui/documentary-ui.js */</script><script>/* @inline:src/ui/references.js */</script><script>/* @inline:src/core/exporter.js */</script><script>/* @inline:src/ui/thumbnails.js */</script><script>/* @inline:src/ui/icons.js */</script><script>/* @inline:src/ui/craft-parts.js */</script><script>/* @inline:src/ui/app.js */</script>
<script>
/* @inline:src/ui/mas-cutroom.js */
</script>
</body></html>
